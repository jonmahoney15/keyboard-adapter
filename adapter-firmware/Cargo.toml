[package]
edition      = "2024"
name         = "adapter-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "adapter-firmware"  # Replace with your actual binary name
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = [] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embassy-usb-driver = "0.2.2"
embassy-usb-host = { version = "0.1.0", features = ["log"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
log = "0.4"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
# `uart`, not `auto`: on the ESP32-S3 the USB Serial/JTAG controller and the USB
# OTG controller share the GPIO19/20 PHY, so once OTG host mode takes the pins
# a USB-Serial-JTAG console would go dead. Logs go out UART0 instead.
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32s3",
  "unstable",
] }
# `security`: HID-over-GATT keystrokes are only served over an encrypted link,
# which requires the security manager (SMP pairing + bonding).
trouble-host = { version = "0.7.0", features = [
  "derive",
  "gatt",
  "log",
  "peripheral",
  "security",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
